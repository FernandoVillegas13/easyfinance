name: Deploy AI Agent Lambda

on:
  push:
    branches:
      - dev
      - qa
      - prod
    paths:
      - "components/ai-agent/**"
      - ".github/workflows/deploy-ai-agent.yml"
      - ".github/actions/deploy-lambda/**"
  workflow_dispatch:

concurrency:
  group: deploy-ai-agent-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build Image and Deploy AI Agent Lambda
    environment: ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Image and Deploy AI Agent Lambda
        uses: ./.github/actions/deploy-lambda
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-account-id: ${{ vars.ACCOUNT_ID }}
          role-arn: arn:aws:iam::${{ vars.ACCOUNT_ID }}:role/github-oidc-cdk
          environment: ${{ github.ref_name }}
          infra-version: ${{ vars.INFRA_VERSION }}
          lambda-name: ai-agent
          lambda-path: components/ai-agent
          sha-tag: ${{ github.sha }}
          session-name-suffix: ai-agent
