name: "Deploy Lambda to AWS"
description: "Reusable action to configure credentials, build, push and update lambda functions"

inputs:
  aws-region:
    description: "AWS region"
    required: true
  aws-account-id:
    description: "AWS account ID"
    required: true
  role-arn:
    description: "AWS role ARN for OIDC authentication"
    required: true
  environment:
    description: "Environment name (dev, qa, prod)"
    required: true
  infra-version:
    description: "Infrastructure version (e.g., v1)"
    required: true
  lambda-name:
    description: "Name of the lambda function (e.g., router, otp)"
    required: true
  lambda-path:
    description: "Path to the lambda source code (relative to repo root)"
    required: true
  sha-tag:
    description: "SHA tag for image versioning"
    required: true
  session-name-suffix:
    description: "Suffix for the AWS session name"
    required: false
    default: "lambda"

outputs:
  image-uri:
    description: "The URI of the deployed image"
    value: ${{ steps.set-outputs.outputs.image-uri }}
  function-name:
    description: "The name of the updated Lambda function"
    value: ${{ steps.set-outputs.outputs.function-name }}
  version:
    description: "The published Lambda version"
    value: ${{ steps.publish-version.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Configure AWS Credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        role-session-name: gha-${{ inputs.session-name-suffix }}-${{ github.run_id }}
        aws-region: ${{ inputs.aws-region }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.lambda-path }}
        platforms: linux/amd64
        push: true
        provenance: false
        sbom: false
        tags: |
          ${{ inputs.aws-account-id }}.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com/${{ inputs.environment }}-${{ inputs.infra-version }}-${{ inputs.lambda-name }}:latest
          ${{ inputs.aws-account-id }}.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com/${{ inputs.environment }}-${{ inputs.infra-version }}-${{ inputs.lambda-name }}:${{ inputs.sha-tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Update Lambda function
      shell: bash
      run: |
        set -euo pipefail

        FUNCTION_NAME="${{ inputs.environment }}-${{ inputs.infra-version }}-${{ inputs.lambda-name }}"
        IMAGE_URI="${{ inputs.aws-account-id }}.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com/${{ inputs.environment }}-${{ inputs.infra-version }}-${{ inputs.lambda-name }}:${{ inputs.sha-tag }}"

        echo "Updating Lambda function: $FUNCTION_NAME"
        echo "New image URI: $IMAGE_URI"

        aws lambda update-function-code \
          --function-name "$FUNCTION_NAME" \
          --image-uri "$IMAGE_URI"

        echo "Successfully updated Lambda function: $FUNCTION_NAME"

    - name: Wait for Lambda update to complete
      shell: bash
      run: |
        FUNCTION_NAME="${{ inputs.environment }}-${{ inputs.infra-version }}-${{ inputs.lambda-name }}"
        echo "Waiting for Lambda function update to complete: $FUNCTION_NAME"
        aws lambda wait function-updated --function-name "$FUNCTION_NAME"
        echo "Lambda function update completed"

    - name: Publish Lambda version
      id: publish-version
      shell: bash
      run: |
        FUNCTION_NAME="${{ inputs.environment }}-${{ inputs.infra-version }}-${{ inputs.lambda-name }}"
        VERSION=$(aws lambda publish-version \
          --function-name "$FUNCTION_NAME" \
          --description "Deployed from commit ${{ inputs.sha-tag }}" \
          --query 'Version' \
          --output text)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Published Lambda version: $VERSION"

    - name: Set outputs
      id: set-outputs
      shell: bash
      run: |
        FUNCTION_NAME="${{ inputs.environment }}-${{ inputs.infra-version }}-${{ inputs.lambda-name }}"
        IMAGE_URI="${{ inputs.aws-account-id }}.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com/${{ inputs.environment }}-${{ inputs.infra-version }}-${{ inputs.lambda-name }}:${{ inputs.sha-tag }}"

        echo "function-name=$FUNCTION_NAME" >> $GITHUB_OUTPUT
        echo "image-uri=$IMAGE_URI" >> $GITHUB_OUTPUT
